name: web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  deployments: write

defaults:
  run:
    working-directory: ./web

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@master

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11.11.0

      - name: Install dependencies 📦
        run: pnpm install

      - name: Run linter 👀
        run: pnpm lint

      - name: Run tests 🧪
        run: pnpm test

      - name: Build 🏗️
        run: mv .env.production .env && echo "GITHUB_SHA=${GITHUB_SHA}" >> .env && pnpm run generate
